  --head:'SamsungSharpSans','Samsung Sharp Sans','Outfit',system-ui,sans-serif;
  --body:'SamsungOne','Samsung One','Inter',system-ui,-apple-system,sans-serif;
  --logo-h:22px;                 /* hæð Samsung-merkis í haus */
  --name-h:calc(var(--logo-h)*.9); /* nafn leiksins: hámark 90% af hæð merkis */
  --r:24px; --frame:440px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);transition:background .3s;font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.02em;line-height:1.08}
@media (min-width:600px){
  body{background:radial-gradient(1100px 700px at 50% -15%,rgba(20,40,160,.38),transparent 60%),#000;background-attachment:fixed}
  .app{border-inline:1px solid var(--line);box-shadow:0 0 140px rgba(20,40,160,.22)}
}
.app{max-width:var(--frame);margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(112px + env(safe-area-inset-bottom));overflow-x:hidden}
@supports (overflow:clip){.app{overflow-x:clip}}

/* ---------- icons ---------- */
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic .ai-logo{width:100%;height:100%;display:block;object-fit:contain}.ic.lg{width:26px;height:26px}

/* ---------- header (eina birting merkisins) ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--hdr);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line);transition:box-shadow .25s,background .25s}
.top.scrolled{box-shadow:var(--hdr-shadow)}
.logo-slot{display:block;height:var(--logo-h);width:calc(var(--logo-h)*6.5208);margin:calc(var(--logo-h)*.5) 0;padding:0;flex:none;background:var(--logo);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat;transition:background .3s}
.pts-chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font:600 14px var(--head);font-variant-numeric:tabular-nums}
.pts-chip .ic{width:16px;height:16px;color:var(--tint)}
.pts-chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12);background:var(--blue)}}

/* ---------- bottom nav (One UI) ---------- */
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),calc(var(--frame) - 24px));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:26px;background:var(--navbg);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--cline);box-shadow:var(--nav-shadow)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;font-size:11px;font-weight:500;color:var(--mu);transition:color .2s}
.nav button .ic{width:44px;height:28px;padding:3px 10px;border-radius:99px;transition:background .25s}
.nav button.on{color:var(--nav-on-tx);font-weight:600}
.nav button.on .ic{background:var(--nav-on)}
.top-r{display:flex;align-items:center;gap:8px}
.theme-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--tx);transition:background .2s}
.theme-btn:hover{background:var(--s3)}
.theme-btn .ic{width:18px;height:18px}

/* ---------- common ---------- */
.cname{font:700 var(--name-h)/1 var(--head);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px}
.cname::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px 2px var(--glow)}
.cname.sm{font-size:13px;color:var(--mu)}
.k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.lede{color:var(--mu);font-size:15.5px;margin-top:10px}
.muted{color:var(--mu)}
.micro{font-size:12.5px;color:var(--mu2);margin-top:12px;line-height:1.45}
.center{text-align:center}
.card{position:relative;background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow);border-radius:var(--r);padding:20px;margin:12px 16px;overflow:hidden}
.card h3{font-size:21px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:99px;font-weight:600;font-size:15px;text-align:center;transition:transform .12s,background .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 10px 30px -10px var(--glow)}
.btn.primary:hover{background:var(--blue-h)}
.btn.ghost{background:var(--s2);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--s3)}
.btn.white{background:#fff;color:#000}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.block{width:100%;margin-top:16px}
.reg-strip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;margin-top:10px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--soft);color:var(--soft-tx);border:1px solid color-mix(in srgb,var(--soft-tx) 18%,transparent);text-align:left;transition:transform .12s,background .2s}
.reg-strip:active{transform:scale(.985)}
.reg-strip .rs-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft-tx);color:var(--soft)}
:root[data-theme="dark"] .reg-strip .rs-ic{background:#fff;color:#1428A0}
.reg-strip b{display:block;font:600 15px var(--head)}
.reg-strip small{display:block;font-size:12.5px;opacity:.78;margin-top:1px;line-height:1.35}
.reg-strip>.ic{opacity:.7}
.btn:disabled{opacity:.35;pointer-events:none}
.link{color:var(--tx);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.gap{gap:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:99px;background:var(--s3);color:var(--mu)}
.tag.dark{background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--s3);color:var(--mu)}
.pill .ic{width:14px;height:14px}
.pill.blue{background:var(--soft);color:var(--soft-tx)}
.pill.ok{background:var(--on);color:var(--on-tx)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 4px}
.sec-h h3{font-size:20px}
.page-h{padding:30px 20px 8px}
.page-h h2{font-size:34px;margin-top:12px}
.demo-note{margin:10px 16px 0;padding:10px 14px;border-radius:14px;border:1px dashed rgba(169,182,255,.35);color:var(--tint);font-size:13px;display:flex;gap:8px;align-items:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- hero ---------- */
.hero{position:relative;padding:38px 20px 14px;overflow:hidden}
.hero h1{font-size:42px;line-height:1.0;margin-top:18px;letter-spacing:-.03em;position:relative}
.hero .lede{position:relative;max-width:32ch}
.hero-orb{position:absolute;right:-110px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(36,66,230,.55),rgba(20,40,160,.16) 45%,transparent 68%);pointer-events:none;animation:breathe 7s ease-in-out infinite}
.hero-orb::before,.hero-orb::after{content:"";position:absolute;inset:60px;border-radius:50%;border:1px solid rgba(255,255,255,.09)}
.hero-orb::after{inset:20px;border-color:rgba(255,255,255,.05)}
@keyframes breathe{50%{transform:scale(1.08)}}

/* ---------- status ---------- */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font:700 34px/1.1 var(--head);font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.02em}
.big-st{display:flex;align-items:center;gap:8px}
.big-st .ic{width:26px;height:26px}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px;position:relative}
.prog::before{content:"";position:absolute;left:10%;right:10%;top:17px;height:2px;background:var(--line2)}
.pstep{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu2);font-weight:500;text-align:center}
.pstep i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line2);font:600 14px var(--head);color:var(--mu)}
.pstep i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pstep.done i{background:var(--on);color:var(--on-tx);border-color:var(--on)}
.pstep.cur i{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 0 5px rgba(20,40,160,.3)}
.pstep.fin i{border-style:dashed}

/* ---------- rail ---------- */
.rail{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-card{flex:0 0 132px;scroll-snap-align:start;border-radius:20px;overflow:hidden;background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow);position:relative;text-align:left}
.rail-card svg.art{display:block;width:100%;height:150px}
.rc-b{padding:10px 12px 12px}
.rc-b b{display:block;font:600 14px/1.2 var(--head);margin-top:2px}
.rail-card .pill{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px;background:rgba(0,0,0,.6);color:#fff}

/* ---------- finale card ---------- */
.finale{background:var(--special);border-color:var(--special-line)}
.fin-glow{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(60,90,255,.45),transparent 65%);pointer-events:none}
.finale h3{margin-top:8px;position:relative}
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 14px;position:relative}
.cd div{background:var(--cd-bg);border:1px solid var(--line);border-radius:16px;padding:10px 0;text-align:center}
.cd b{display:block;font:700 28px/1.1 var(--head);font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.finale p{position:relative;margin-bottom:14px}

/* feature cards */
.feat{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:calc(100% - 32px);text-align:left}
.feat h3{font-size:18px;margin:6px 0 4px}
.feat p{font-size:14px;color:var(--mu)}
.feat-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--soft);color:var(--soft-ic)}
.feat-ic .ic{width:26px;height:26px}
/* Einfalt að skipta */
.swcard{position:relative;display:grid;grid-template-columns:1fr;width:calc(100% - 32px);padding:0;overflow:hidden;text-align:left;color:#fff;background:radial-gradient(120% 90% at 85% 0%,#2a45e0 0%,#1428A0 38%,#0a1150 100%);border:0}
.swcard .sw-art{padding:22px 20px 0}
.swcard .sw-txt{padding:6px 22px 22px}
.swcard .k{color:rgba(255,255,255,.7)}
.swcard h3{font:700 28px/1.05 var(--head);letter-spacing:-.02em;margin:6px 0 6px;color:#fff}
.swcard p{font-size:14.5px;color:rgba(255,255,255,.82);max-width:36ch}
.sw-cta{display:inline-flex;align-items:center;gap:4px;margin-top:14px;padding:9px 16px;border-radius:99px;background:#fff;color:#0b0c10;font-weight:600;font-size:14px}
.sw-cta .ic{width:16px;height:16px}
.swcard:active{transform:scale(.99)}
.sw-art svg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.sw-head{margin:-2px -20px 16px;padding:18px 20px 14px;border-radius:24px;background:radial-gradient(120% 90% at 85% 0%,#2a45e0 0%,#1428A0 38%,#0a1150 100%)}
.sw-art.sm svg{max-width:240px}
.sw-what{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sw-what li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.sw-what .ic{width:18px;height:18px;color:var(--tint);flex:none}
a.btn{text-decoration:none}
.sw-note{margin-top:10px;line-height:1.5}
.sw-steps{margin-top:6px}
.sw-steps li{color:var(--tx2);padding:11px 0;border-top:1px solid var(--line);grid-template-columns:30px 1fr;gap:12px}
.sw-steps li:first-child{border-top:0}
.sw-steps li::before{background:var(--soft);color:var(--soft-tx);border:0}
.sw-steps b{display:block;color:var(--tx);font-weight:600;font-size:15px}
.sw-steps span{display:block;font-size:14px;color:var(--mu);margin-top:2px;line-height:1.45}
.qz-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.qz-links .qz-again{margin:0}
.bundle{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.bundle svg{width:92px;height:72px}
.bundle h3{font-size:19px;margin:4px 0}
.retail{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.how{counter-reset:h;list-style:none;margin-top:6px}
.how li{counter-increment:h;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.how li:first-child{border-top:0}
.how li::before{content:counter(h);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line2);font:600 15px var(--head)}
.how b{display:block;font-family:var(--head);font-weight:600}
.how span{font-size:14px;color:var(--mu)}
.foot{padding:28px 20px 10px;color:var(--mu2);font-size:12.5px;line-height:1.6}
.foot nav{display:flex;gap:16px;margin-top:8px}
.motto{margin:6px 0 22px;padding-bottom:24px;border-bottom:1px solid var(--line);font:600 42px/1 var(--head);letter-spacing:0;color:var(--tx)}
@media (min-width:1024px){.motto{font-size:54px}}
.foot nav a{color:var(--mu);text-decoration:none}

/* ---------- episodes ---------- */
.ep{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;padding:12px;border-radius:24px;background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow);text-align:left;margin:10px 16px;width:calc(100% - 32px);transition:background .2s}
.ep:hover{background:var(--s2)}
.ep-art{position:relative;width:100px;height:124px;border-radius:16px;overflow:hidden}
.ep-art svg{width:100%;height:100%;display:block}
.ep-len{position:absolute;right:6px;bottom:6px;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65)}
.ep-b b{display:block;font:600 17px/1.2 var(--head);margin:4px 0 4px}
.ep-b p{font-size:13.5px;color:var(--mu);line-height:1.4}
.ep-st{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ep.locked .ep-art{filter:grayscale(.6) brightness(.6)}
.ep.fin-card{grid-template-columns:100px 1fr;border-color:var(--special-line);background:var(--special)}

/* ---------- leaderboard ---------- */
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin-top:10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 0 rgba(120,140,255,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:14px 16px 4px;padding:4px;background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow);border-radius:99px}
.seg button{height:38px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mu);text-align:center}
.seg button.on{background:var(--on);color:var(--on-tx)}
.mine{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.mine .rk{font:700 30px var(--head);min-width:56px}
.mine small{display:block;color:var(--mu);font-size:13px}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;padding:18px 16px 4px}
.pod{text-align:center}
.pod .av{margin:0 auto 8px;width:52px;height:52px;font-size:19px}
.pod:nth-child(2) .av{width:64px;height:64px;font-size:23px;box-shadow:0 0 0 3px var(--blue),0 0 30px var(--glow)}
.pod b{display:block;font:600 13.5px/1.2 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod small{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.pod .base{margin-top:8px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,var(--s3),var(--s1));display:grid;place-items:center;font:700 22px var(--head);color:var(--mu)}
.pod:nth-child(1) .base{height:56px}.pod:nth-child(2) .base{height:80px;background:linear-gradient(180deg,var(--blue),#0a1450);color:#fff}.pod:nth-child(3) .base{height:44px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font:600 15px var(--head);flex:none}
.av.me{background:var(--on);color:var(--on-tx)}
.lb{list-style:none;margin:6px 16px 0;border-radius:var(--r);background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow);overflow:hidden}
.lb li{display:grid;grid-template-columns:30px 38px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);transition:background .6s}
.lb li:first-child{border-top:0}
.lb .n{font:600 14px var(--head);color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.lb .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .v{font:600 15px var(--head);font-variant-numeric:tabular-nums}
.lb li.me{background:var(--soft)}
.lb li.flash{background:var(--flash)}
.lb li.cut{display:block;padding:9px 14px;background:repeating-linear-gradient(-45deg,rgba(20,40,160,.25) 0 8px,rgba(20,40,160,.12) 8px 16px);font-size:12px;font-weight:600;color:var(--soft-tx);text-align:center;letter-spacing:.03em}
.up{font-size:11px;color:var(--tint);margin-left:6px}

/* ---------- AI tool ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:10px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line2);font-size:14px;font-weight:500;transition:all .2s}
.chip.on{background:var(--on);color:var(--on-tx);border-color:var(--on)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin-top:6px}
.range::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--blue) var(--p,0%),var(--s3) var(--p,0%))}
.range::-moz-range-track{height:6px;border-radius:9px;background:var(--s3)}
.range::-moz-range-progress{height:6px;border-radius:9px;background:var(--blue)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.mega{font:700 64px/1 var(--head);letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.mega small{font-size:18px;color:var(--mu);font-weight:600;letter-spacing:0}
.ai-out{background:var(--special);border-color:var(--special-line)}
.rec{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center}
.rec svg{width:84px;height:104px;border-radius:16px}
.rec h3{margin:4px 0 6px}
.rec p{color:var(--mu);font-size:14px}
.tips{list-style:none;counter-reset:t;margin-top:10px}
.tips li{counter-increment:t;padding:12px 0 12px 40px;position:relative;border-top:1px solid var(--line)}
.tips li::before{content:counter(t);position:absolute;left:0;top:12px;width:28px;height:28px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font:600 13px var(--head)}
.tips b{display:block;font-family:var(--head);font-weight:600}
.tips span{font-size:14px;color:var(--mu)}
.fade-in{animation:fadeUp .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}

/* ---------- forms ---------- */
.f{display:block;margin-top:14px}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:6px}
.f>span i{font-style:normal;font-weight:400;color:var(--mu2)}
.f input,.tel{width:100%;height:52px;border-radius:16px;background:var(--s2);border:1px solid var(--line2);padding:0 16px;outline:none;transition:border .2s,box-shadow .2s}
.f input:focus,.tel:focus-within{border-color:#4a63ff;box-shadow:0 0 0 4px rgba(20,40,160,.35)}
.tel{display:flex;align-items:center;gap:10px;padding:0 0 0 16px}
.tel em{font-style:normal;color:var(--mu);font-weight:500}
.tel input{border:0;background:none;height:100%;padding:0 16px 0 0;box-shadow:none!important}
.f.err input,.f.err .tel{border-color:var(--bad)}
.f .msg{display:none;font-size:12.5px;color:var(--bad);margin-top:6px}
.f.err .msg{display:block}
.cb{display:grid;grid-template-columns:24px 1fr;gap:12px;margin-top:16px;font-size:14px;color:var(--mu);line-height:1.45;cursor:pointer}
.cb input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);background:var(--s2);display:grid;place-items:center;margin-top:1px;cursor:pointer}
.cb input:checked{background:var(--blue);border-color:var(--blue)}
.cb input:checked::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.4px 2.4px;transform:translate(0,-1px) rotate(-45deg)}
.cb i{font-style:normal;color:var(--mu2);font-size:12.5px;display:block;margin-top:2px}
.cb.err input{border-color:var(--bad)}
.cb a{color:var(--tx)}
/* Google innskráning — litir og form samkvæmt vörumerkjareglum Google */
.gbtn{--g-bg:#fff;--g-bd:#747775;--g-tx:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:50px;margin-top:6px;padding:0 20px;border-radius:99px;background:var(--g-bg);border:1px solid var(--g-bd);color:var(--g-tx);font:500 15px Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.1px;transition:background .2s,opacity .2s,transform .12s}
:root[data-theme="dark"] .gbtn{--g-bg:#131314;--g-bd:#8e918f;--g-tx:#e3e3e3}
.gbtn:hover{background:color-mix(in srgb,var(--g-bg) 92%,var(--g-tx))}
.gbtn:active{transform:scale(.98)}
.gbtn[aria-busy="true"]{opacity:.6;pointer-events:none}
.gbtn svg{width:20px;height:20px;flex:none}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 2px;font-size:12.5px;color:var(--mu2)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.gacct{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:6px;padding:12px 14px;border-radius:18px;background:var(--s2);border:1px solid var(--line2)}
.gacct b{display:block;font:600 15px var(--head)}
.gacct small{display:block;color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gacct .gtag{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;color:var(--mu2)}
.gacct .gtag svg{width:13px;height:13px}
.gnote{margin-top:6px;padding:12px 14px;border-radius:16px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;color:var(--mu);line-height:1.45}
.f[hidden],.or[hidden]{display:none}
/* vinnustaðir og skólar: leit í lista */
.f.org{scroll-margin-top:84px}
.ac{margin-top:6px;border-radius:16px;background:var(--s1);border:1px solid var(--line2);overflow:hidden;box-shadow:var(--shadow)}
.ac[hidden]{display:none}
.ac button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:12px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.3;color:var(--tx);text-align:left}
.ac button:first-child{border-top:0}
.ac button small{flex:none;color:var(--mu2);font-size:12px;font-weight:500}
.ac button:hover,.ac button.on{background:var(--s2)}
.ac p{padding:12px 16px;font-size:13px;color:var(--mu);line-height:1.45}
/* leikreglur og persónuvernd */
.doc{position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--tx);overflow-y:auto;overscroll-behavior:contain;opacity:0;transform:translateY(14px);transition:opacity .25s,transform .3s cubic-bezier(.2,.85,.2,1)}
.doc.on{opacity:1;transform:none}
.doc-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,calc((100% - 760px)/2 + 20px));padding-top:calc(10px + env(safe-area-inset-top));background:var(--hdr);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line)}
.doc-tabs{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
.doc-tabs button{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mu);transition:background .2s,color .2s}
.doc-tabs button.on{background:var(--on);color:var(--on-tx)}
.doc-x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.doc-body{max-width:760px;margin:0 auto;padding:26px 20px calc(48px + env(safe-area-inset-bottom))}
.doc-h h1{font:700 34px/1.08 var(--head);letter-spacing:-.02em;margin-top:10px}
.doc-h .lede{max-width:60ch}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill.warn{background:rgba(255,186,0,.16);color:#c98a00}
:root[data-theme="dark"] .pill.warn{color:#ffc94d}
.doc-sum{margin-top:22px;padding:18px 20px;border-radius:22px;background:var(--soft);color:var(--soft-tx)}
.doc-sum .k{color:inherit;opacity:.8}
.doc-sum ul{list-style:none;margin-top:10px;display:grid;gap:10px}
.doc-sum li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:15px;line-height:1.5}
.doc-sum .ic{width:18px;height:18px;margin-top:2px;color:var(--soft-ic)}
.doc-toc{margin-top:16px;padding:16px 20px;border-radius:22px;background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow)}
.doc-toc ol{list-style:none;margin-top:8px;display:grid;gap:2px}
.doc-toc a{display:flex;gap:12px;align-items:baseline;padding:7px 0;color:var(--tx);text-decoration:none;font-size:15px;font-weight:500}
.doc-toc a b{width:20px;flex:none;color:var(--mu2);font:600 13px var(--head);font-variant-numeric:tabular-nums}
.doc-body .doc-toc a{color:var(--tx)}
.doc-body .doc-toc a:hover{color:var(--tint)}
@media (min-width:720px){.doc-toc ol{grid-template-columns:1fr 1fr;column-gap:28px}}
.doc-body section{margin-top:34px;scroll-margin-top:84px}
.doc-body h2{display:flex;gap:12px;align-items:baseline;font:600 21px/1.25 var(--head);letter-spacing:-.01em}
.doc-body h2 .no{flex:none;min-width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--s2);border:1px solid var(--line2);font-size:13px;color:var(--mu);transform:translateY(-3px)}
.doc-body section p,.doc-body section li{font-size:15px;line-height:1.62;color:var(--tx2)}
.doc-body section p{margin-top:10px}
.doc-body section ul{margin-top:10px;padding-left:20px;display:grid;gap:8px}
.doc-body section li::marker{color:var(--mu2)}
.doc-body b{color:var(--tx);font-weight:600}
.doc-body a{color:var(--tint)}
.doc-body code{font-size:13px;padding:1px 6px;border-radius:6px;background:var(--s2)}
.tbl{margin-top:12px;border-radius:18px;border:1px solid var(--line2);overflow:hidden;background:var(--s1)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.5}
.tbl th{text-align:left;padding:10px 14px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);background:var(--s2)}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;color:var(--tx2)}
.tbl td:first-child{color:var(--tx);font-weight:500;width:38%}
.tbl td small{display:block;color:var(--mu2);font-size:12px;font-weight:400}
mark.ph{background:rgba(255,186,0,.22);color:inherit;padding:0 4px;border-radius:4px}
.doc-f{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mu2)}
.doc-f .ic{transform:rotate(-90deg)}
@media (max-width:520px){.tbl table,.tbl tbody,.tbl tr,.tbl td{display:block}.tbl thead{display:none}.tbl tr{border-top:1px solid var(--line);padding:10px 14px}.tbl tr:first-child{border-top:0}.tbl td{border:0;padding:2px 0;width:auto!important}.doc-h h1{font-size:30px}}

.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.pill svg{width:13px;height:13px}

/* pins */
.pins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.pins input{width:100%;min-width:0;height:64px;border-radius:18px;background:var(--s2);border:1px solid var(--line2);text-align:center;font:700 28px var(--head);outline:none;caret-color:var(--tint)}
.pins input:focus{border-color:#4a63ff;box-shadow:0 0 0 4px rgba(20,40,160,.35)}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.prof .av{width:58px;height:58px;font-size:22px}
.prof b{font:600 19px var(--head);display:block}
.prof small{color:var(--mu);font-size:13.5px}
.lines{list-style:none;margin-top:8px}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.lines li:first-child{border-top:0}
.lines li span{color:var(--mu)}
.lines li b{font-family:var(--head);font-weight:600;font-variant-numeric:tabular-nums}
.lines li.tot{border-top:1px solid var(--line2);font-size:16px}
.lines li.tot span{color:var(--tx);font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:var(--s3);position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--blue)}
.sw:checked::after{transform:translateX(22px)}

/* stores */
.stores{list-style:none;margin-top:16px;border-radius:20px;border:1px solid var(--line2);overflow:hidden}
.stores li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.stores li:first-child{border-top:0}
.stores .si{width:38px;height:38px;border-radius:12px;background:var(--s2);display:grid;place-items:center}
.stores b{display:block;font-weight:600}
.stores small{color:var(--mu);font-size:12.5px}
.stores em{font-style:normal;font:600 13px var(--head);color:var(--mu)}
.stores li.ok em{color:var(--on-tx);background:var(--on);padding:3px 9px;border-radius:99px}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,var(--frame));transform:translate(-50%,105%);transition:transform .42s cubic-bezier(.2,.85,.2,1);z-index:41;background:var(--s1);border-radius:30px 30px 0 0;border-top:1px solid var(--line2);max-height:92dvh;overflow:auto;padding:8px 20px calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet:not(.on){visibility:hidden;transition:transform .42s cubic-bezier(.2,.85,.2,1),visibility 0s .42s}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
.sh-x{position:fixed;z-index:6;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.sh-t{font-size:26px;margin-top:6px}
.vid{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;margin-top:6px;background:#05060f}
.vid svg.art{position:absolute;inset:0;width:100%;height:100%}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 55%,rgba(0,0,0,.8))}
.vid-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.vid-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);color:#000;display:grid;place-items:center;z-index:3;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .2s,opacity .3s}
.vid-play svg{width:30px;height:30px;margin-left:4px}
.vid-play:active{transform:translate(-50%,-50%) scale(.94)}
.vid.playing .vid-play{opacity:0;pointer-events:none}
.vid-cap{position:absolute;left:16px;right:16px;bottom:44px;z-index:2;font:600 19px/1.25 var(--head);text-shadow:0 2px 12px rgba(0,0,0,.8);min-height:48px}
.vid-cap span{animation:fadeUp .4s both;display:block}
.vid-bar{position:absolute;left:16px;right:16px;bottom:26px;height:3px;border-radius:9px;background:rgba(255,255,255,.25);z-index:2;overflow:hidden}
.vid-bar i{display:block;height:100%;width:0;background:#fff}
.vid-note{position:absolute;left:16px;right:16px;bottom:8px;z-index:2;font-size:10.5px;color:rgba(255,255,255,.55)}
.vid.done .vid-cap{color:#fff}
.usp{list-style:none;margin-top:14px}
.usp li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 0;font-size:15px}
.usp .ic{width:22px;height:22px;color:var(--tint)}
.ch-box{margin-top:16px;padding:16px;border-radius:20px;background:var(--s2);border:1px solid var(--line)}
.ch-box p{margin:6px 0 10px}
.ch-box .row span{font-size:14px;color:var(--mu)}
.ch-box b{color:var(--tx)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--on);color:var(--on-tx);font-weight:600;font-size:14px;padding:12px 18px;border-radius:99px;box-shadow:0 10px 40px rgba(0,0,0,.6);transition:all .3s;max-width:calc(min(100%,var(--frame)) - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   STAGE (áskoranir)
   ========================================================= */
.stage{--bg:#000;--s1:#0d0e11;--s2:#16171b;--s3:#202228;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--tx:#fff;--tx2:#d4d7e2;--mu:#a3a5ae;--mu2:#7d808a;--tint:#a9b6ff;--on:#fff;--on-tx:#000;--soft:rgba(20,40,160,.35);--soft-tx:#e4e8ff;--soft-ic:#fff;--cline:var(--line);--shadow:none;--bad:#ff6b6b;position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--frame));background:#000;color:var(--tx);z-index:60;display:flex;flex-direction:column;overflow:hidden}
.stage[hidden]{display:none}
.stage-top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top))}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
.st-title{flex:1;min-width:0}
.st-title .k{font-size:11px}
.st-t{font:600 16px/1.2 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:600 15px var(--head);font-variant-numeric:tabular-nums;background:var(--s2);padding:7px 12px;border-radius:99px;min-width:70px;text-align:center}
.timer.run{background:var(--blue)}
.stage-body{flex:1;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));position:relative;overscroll-behavior:contain}
.intro{padding:6px 2px}
.intro svg.art{width:100%;height:180px;border-radius:24px;display:block;margin-bottom:18px}
.intro h2{font-size:28px;margin:6px 0 12px}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:7px 0;color:#d9dbe2}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center;font:600 12px var(--head)}
.score-hint{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(20,40,160,.3);color:#e4e8ff;font-size:14px;font-weight:500}
.score-hint .ic{color:#fff}
.g-ins{font-size:14.5px;color:#d9dbe2;margin-bottom:12px;line-height:1.45}
.g-ins b{color:#fff;font-family:var(--head);font-weight:600}
.sim-tag{position:absolute;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);z-index:4}

/* --- game 1: zoom --- */
.cam{position:relative;border-radius:24px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.cam canvas{display:block;width:100%;touch-action:none;cursor:grab}
.cam canvas:active{cursor:grabbing}
.reticle{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);pointer-events:none;border:1.5px solid rgba(255,255,255,.6);border-radius:12px;transition:left .25s,top .25s}
.reticle.pop{animation:retpop .45s}
@keyframes retpop{0%{width:90px;height:90px;border-color:#fff}100%{width:54px;height:54px}}
.reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.cam-ui{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.night-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.night-btn .ic{width:16px;height:16px}
.night-btn.on{background:#fff;color:#000}
.night-btn.pulse{animation:glowp 1.4s infinite}
@keyframes glowp{50%{box-shadow:0 0 0 6px rgba(255,255,255,.18)}}
.zread{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:700 15px var(--head);padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.6);font-variant-numeric:tabular-nums;z-index:3}
.nproc{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:12px;font-size:14px;font-weight:600;z-index:4;background:rgba(0,0,0,.25)}
.nproc.on{display:grid}
.nproc i{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite;justify-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
.zpre{display:flex;justify-content:center;gap:6px;margin-top:12px}
.zpre button{min-width:52px;height:36px;border-radius:99px;background:var(--s2);font:600 13px var(--head);text-align:center}
.zpre button.on{background:#fff;color:#000}
.code-row{margin-top:14px;padding:16px;border-radius:22px;background:var(--s1);border:1px solid var(--line)}
.code-row .btn.block{margin-top:12px}

/* --- game 2: fold --- */
.fold-stage{perspective:1400px;padding:6px 0}
.fold{display:grid;grid-template-columns:1fr 6px 1fr;border-radius:26px;background:#0b0c10;border:5px solid #1c1d23;box-shadow:0 30px 60px -20px rgba(20,40,160,.5);min-height:420px;transform-style:preserve-3d}
.pane{background:#0f1015;padding:10px 8px 12px;min-width:0;display:flex;flex-direction:column}
.pl{border-radius:20px 0 0 20px;transform-origin:right center;transition:transform 1s cubic-bezier(.3,.75,.2,1);backface-visibility:hidden}
.pr{border-radius:0 20px 20px 0}
.fold.folded .pl{transform:rotateY(178deg)}
.hinge{background:linear-gradient(90deg,#000,#24262e,#000)}
.app-bar{display:flex;align-items:center;gap:6px;font:600 13px var(--head);padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.app-bar .ic{width:16px;height:16px;color:var(--tint)}
.mail-h{padding:8px 4px 6px}
.mail-h b{display:block;font-size:12.5px;line-height:1.25}
.mail-h small{font-size:10.5px;color:var(--mu2)}
.dragl{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dchip{padding:8px 9px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:opacity .2s,transform .2s}
.dchip b{display:block;font-size:12px;line-height:1.2;font-weight:600}
.dchip small{display:block;font-size:10.5px;color:var(--mu);margin-top:2px;line-height:1.2}
.dchip.lifting{opacity:.25}
.dchip.used{opacity:0;transform:scale(.9);pointer-events:none;height:0;padding:0;margin-top:-6px;border:0;overflow:hidden}
.dragghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.6);background:#2a2d38;border-color:rgba(255,255,255,.35);color:#fff}
.dragghost small{color:#a3a5ae}
.cal-h{font-size:11.5px;color:var(--mu);padding:8px 4px 4px}
.slot{border:1.5px dashed var(--line2);border-radius:14px;padding:7px 8px;margin-top:6px;transition:all .2s;min-height:74px}
.sl-t{font:600 11.5px var(--head);color:var(--tint)}
.sl-l{font-size:10.5px;color:var(--mu2);margin-left:5px}
.sl-in{font-size:11px;color:var(--mu2);margin-top:6px}
.sl-in b{display:block;font-size:12px;color:#fff;line-height:1.2}
.sl-in small{display:block;font-size:10.5px;color:#d7dcff;margin-top:2px}
.slot.hover{border-color:#fff;background:rgba(20,40,160,.35);transform:scale(1.02)}
.slot.filled{border-style:solid;border-color:var(--blue);background:rgba(20,40,160,.45)}
.slot.bad{border-color:var(--bad);animation:shake .35s}
.fold-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:600 14px var(--head)}

/* --- game 3: flip --- */
.steps-ind{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.steps-ind i{height:4px;border-radius:9px;background:var(--s3);transition:background .3s}
.steps-ind i.on{background:#fff}
.flip-box{position:relative;border-radius:24px;background:radial-gradient(120% 90% at 50% 100%,#0e1752,#04050c 70%);border:1px solid var(--line);overflow:hidden}
.flip-svg{display:block;width:100%;touch-action:none;cursor:grab;user-select:none}
.flip-svg .table{stroke:rgba(255,255,255,.25);stroke-width:1.5}
.flip-svg .ph{fill:#2b2e38;stroke:#8f95a8;stroke-width:.8}
.flip-svg .cover{fill:#4b63ff}
.flip-svg .zone{fill:none;stroke:rgba(169,182,255,.35);stroke-width:14;stroke-linecap:round}
.flip-svg .zone.on{stroke:rgba(255,255,255,.75)}
.flip-svg .handle{fill:#fff;stroke:rgba(20,40,160,.9);stroke-width:4}
.flip-svg .hingec{fill:#1428A0;stroke:#fff;stroke-width:1.5}
.angle{position:absolute;right:14px;top:12px;text-align:right}
.angle b{display:block;font:700 34px/1 var(--head);font-variant-numeric:tabular-nums}
.angle span{font-size:12px;color:var(--mu);font-weight:600}
.angle.on span{color:#fff}
.flexlbl{position:absolute;left:14px;top:14px;opacity:0;transition:opacity .3s}
.flexlbl.on{opacity:1;background:#fff;color:#000}
.vf{position:relative;width:100%;aspect-ratio:1;border-radius:34px;overflow:hidden;border:6px solid #1c1d23;touch-action:none;user-select:none;cursor:grab;background:#0b1240}
.vf-scene{position:absolute;left:0;top:0;width:200%;height:200%;will-change:transform}
.vf-scene svg{width:100%;height:100%;display:block}
.vf-guide{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(255,255,255,.7);pointer-events:none;transition:all .2s}
.vf-guide.ok{border-style:solid;border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.2)}
.vf-lbl{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.55)}
.cdn{position:absolute;inset:0;display:grid;place-items:center;font:800 120px var(--head);text-shadow:0 6px 40px rgba(0,0,0,.6);pointer-events:none}
.cdn span{animation:pop .6s both;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-size:76px}
@keyframes pop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(.9);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .6s}
@keyframes flash{10%{opacity:1}100%{opacity:0}}
.palm{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:84px;margin-top:14px;border-radius:26px;background:var(--s1);border:1px solid var(--line2);font:600 16px var(--head);user-select:none;-webkit-user-select:none;touch-action:none}
.palm .pi{position:relative;width:58px;height:58px;display:grid;place-items:center}
.palm .pi .ic{width:30px;height:30px}
.palm svg.ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.palm svg.ring circle{fill:none;stroke:#fff;stroke-width:3.5;stroke-dasharray:176;stroke-dashoffset:176;stroke-linecap:round}
.palm.hold svg.ring circle{transition:stroke-dashoffset .7s linear;stroke-dashoffset:0}
.palm.hold{background:var(--blue)}

/* --- game 4: circle to search --- */
.cts-q{padding:14px 16px;border-radius:20px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.cts-q p{margin-top:4px;font-size:15px;line-height:1.4}
.cts-phone{position:relative;border-radius:36px;border:6px solid #1c1d23;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.cts-scr{position:relative}
.cts-scr svg{display:block;width:100%}
.cts-scr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
.cts-phone.active .cts-scr canvas{pointer-events:auto;cursor:crosshair}
.cts-tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:linear-gradient(180deg,rgba(20,40,160,.28),rgba(0,0,0,.12) 40%,rgba(20,40,160,.28));box-shadow:inset 0 0 0 2px rgba(169,182,255,.55),inset 0 0 50px rgba(60,90,255,.5)}
.cts-phone.active .cts-tint{opacity:1}
.cts-hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:99px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;pointer-events:none}
.cts-phone.active .cts-hint{opacity:1}
.navbar{height:40px;display:grid;place-items:center;background:#000;touch-action:none;cursor:pointer}
.navbar i{display:block;width:120px;height:5px;border-radius:9px;background:#fff;transition:all .3s}
.navbar.pulse i{animation:pillp 1.4s infinite}
@keyframes pillp{50%{box-shadow:0 0 0 6px rgba(255,255,255,.2),0 0 22px rgba(80,110,255,.9)}}
.navbar.press i{width:150px;background:var(--tint)}
.cts-res{position:absolute;left:8px;right:8px;bottom:48px;visibility:hidden;opacity:0;padding:16px;border-radius:24px;background:rgba(18,19,24,.96);border:1px solid var(--line2);transform:translateY(130%);transition:transform .45s cubic-bezier(.2,.85,.2,1),opacity .3s,visibility .45s;z-index:5;backdrop-filter:blur(10px)}
.cts-res.on{transform:none;visibility:visible;opacity:1}
.cts-res .k{display:flex;align-items:center;gap:6px;color:var(--tint)}
.cts-res .k .ic{width:16px;height:16px}
.cts-res b{display:block;font:600 19px var(--head);margin:6px 0 4px}
.cts-res p{font-size:13.5px;color:var(--mu);margin-bottom:12px}
.cts-msg{min-height:22px;margin-top:10px;font-size:14px;text-align:center;color:var(--mu)}
.cts-msg.bad{color:var(--bad)}

/* --- result --- */
.result{text-align:center;padding:20px 4px;position:relative}
.burst{position:relative;width:180px;height:180px;margin:6px auto 0;display:grid;place-items:center}
.burst::before,.burst::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(80,110,255,.6);animation:ring 1.6s ease-out infinite}
.burst::after{animation-delay:.5s}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.3);opacity:0}}
.burst .core{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b58ff,#1428A0 60%,#0a1450);display:grid;place-items:center;box-shadow:0 0 60px var(--glow)}
.burst .core b{font:800 34px/1 var(--head);font-variant-numeric:tabular-nums}
.burst .core small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
.result h2{font-size:28px;margin-top:18px}
.bd{list-style:none;text-align:left;margin:18px 0 6px;border-radius:20px;background:var(--s1);border:1px solid var(--line);padding:4px 16px}
.bd li{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.bd li:first-child{border-top:0}
.bd li span{color:var(--mu)}
.bd li b{font-family:var(--head);font-weight:600;font-variant-numeric:tabular-nums}
.rank-line{font-size:15px;color:var(--mu);margin-top:10px}
.rank-line b{color:var(--tx)}
.res-btns{display:grid;gap:10px;margin-top:18px}
.cal-opts{display:grid;gap:10px;margin-top:18px}
.cal-opts .btn{width:100%;text-decoration:none}
.res-btns .btn{width:100%}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- v2: vinningar, vinnustaðir, deiling ---------- */
.seg3{grid-template-columns:repeat(3,1fr)}
.ref-banner{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:12px 16px 0;padding:12px 14px;border-radius:20px;background:var(--blue);color:#fff;box-shadow:0 10px 30px -10px var(--glow)}
.ref-banner b{display:block;font:600 15px var(--head)}
.ref-banner span{font-size:13px;opacity:.85}
.pz{display:block}
.prizes-hero{display:block;width:calc(100% - 32px);text-align:left;background:var(--special);border-color:var(--special-line)}
.prizes-hero h3{margin:6px 0 10px;font-size:20px}
.ph-art{display:flex;gap:4px;margin:-4px -4px 12px}
.ph-art .pz{width:52px;height:52px;flex:none;filter:drop-shadow(0 6px 14px rgba(20,40,160,.6))}
.mini-prizes{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini-prizes li{background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:18px;padding:10px 8px 12px;text-align:center}
.mini-prizes .pz{width:52px;height:52px;margin:0 auto 6px}
.mini-prizes span{font-size:12.5px;color:var(--mu);line-height:1.3;display:block}
.mini-prizes b{display:block;color:var(--tx);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.week-card h3{margin-top:6px}
.mile-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:calc(100% - 32px);text-align:left;background:var(--on);color:var(--on-tx);border-color:var(--on)}
.mile-card b{display:block;font:700 17px var(--head)}
.mile-card span{font-size:13.5px;opacity:.78}
.mile-card .ic.lg{color:var(--tint)}
.mine-card .mine,.card .mine{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.pot{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--s2);font-size:13.5px;color:var(--mu);line-height:1.4}
.pot .ic{margin-top:1px;color:var(--tint)}
.pot.ok{background:var(--soft);color:var(--soft-tx)}
.pot.ok .ic{color:var(--soft-ic)}
.lb .nm small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.lb .nm small.next{color:var(--soft-tx);font-size:12.5px;margin-top:1px;white-space:normal}
.lb .nm small.next b{font-weight:700}
.lb .av .ic{width:18px;height:18px}
.grand{text-align:center;background:var(--special);border-color:var(--special-line)}
.grand-art{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 12px}
.grand-art .pz{width:110px;height:110px;filter:drop-shadow(0 12px 30px rgba(40,70,230,.6))}
.grand-art span{font:700 30px var(--head);color:var(--mu)}
.grand h3{font-size:22px;margin-top:6px}
.prize-list{list-style:none;margin:8px 16px 0;border-radius:var(--r);background:var(--s1);border:1px solid var(--cline);box-shadow:var(--shadow);overflow:hidden}
.prize-list li{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.prize-list li:first-child{border-top:0}
.pz-art{display:flex;justify-content:center;height:48px;align-items:center}
.pz-art .pz{width:46px;height:46px}
.pz-art .pz+.pz{margin-left:-14px}
.prize-list b{display:block;font:600 15px var(--head)}
.prize-list span{display:block;font-size:13px;color:var(--mu);line-height:1.35;margin-top:2px}
.prize-list em{font-style:normal;font:700 18px var(--head);color:#fff;background:var(--blue);min-width:46px;height:34px;border-radius:99px;display:grid;place-items:center;padding:0 10px}
.how2{list-style:none;margin-top:10px}
.how2 li{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.how2 li:first-child{border-top:0}
.how2 b{font:800 30px var(--head);color:#fff;background:var(--blue);border-radius:16px;height:50px;display:grid;place-items:center}
.how2 span{color:var(--mu);font-size:14.5px}
.predict{border:1.5px dashed var(--line2);box-shadow:none}
.predict h3{margin:6px 0 4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{padding:13px 16px;border-radius:16px;background:var(--s2);border:1px solid var(--line2);font-size:15px;font-weight:500;transition:all .2s}
.opt.on{background:var(--on);color:var(--on-tx);border-color:var(--on)}
.persona{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;background:var(--special);border-color:var(--special-line)}
.persona svg{width:96px;height:120px;border-radius:18px}
.persona h3{font-size:26px;margin-top:2px}
.persona p{color:var(--tx2);font-size:14px}
.linkbox{display:flex;align-items:center;gap:8px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px dashed var(--line2);font-size:13.5px;color:var(--tint);overflow:hidden}
.linkbox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-prev{margin:14px auto 0;width:min(62%,240px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:var(--s2);display:grid;place-items:center;box-shadow:0 20px 50px -10px rgba(20,40,160,.6)}
.card-prev img{width:100%;height:100%;display:block}
.card-prev i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
.host-rec{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--mu)}
.host-rec .ic{color:var(--tint)}
.host-rec b{color:var(--tx)}
.host-rec.big{margin-top:10px;padding:12px 14px;border-radius:16px;border:1px solid rgba(169,182,255,.3);font-size:14px;color:#e4e8ff}
.host-line{display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px;color:var(--mu);margin-top:12px}
.host-line .ic{color:var(--tint)}
.host-line b{color:var(--tx)}
.mile{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;border-radius:99px;background:var(--on);color:var(--on-tx);font-weight:600;font-size:14px}
.vid-code{position:absolute;right:16px;top:52px;z-index:3;font:800 22px var(--head);letter-spacing:.08em;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.92);color:#1428A0;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
.vid-code.on{opacity:1;transform:none}
.ch-box .pins{margin-top:8px}
.ch-box .pins input{height:54px;font-size:24px}
.share-cta{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.share-cta h3{font-size:19px;margin:4px 0 2px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--soft);color:var(--soft-tx);font-size:13px;font-weight:600}
.badge .ic{color:var(--soft-ic)}
.qz{border-color:var(--special-line);background:var(--special)}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qz-top .k{display:flex;align-items:center;gap:6px;color:var(--tint)}
.qz-step{font:600 13px var(--head);color:var(--mu);font-variant-numeric:tabular-nums}
.qz-bar{height:4px;border-radius:9px;background:var(--s3);margin-top:12px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--on);border-radius:9px;transition:width .3s}
.qz-q{font-size:22px;margin:16px 0 4px}
.qz-res{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;margin-top:14px}
.qz-art svg{width:84px;height:104px;border-radius:16px;display:block}
.qz-type{font-size:30px;margin:2px 0 6px}
.qz-res p{font-size:14px;color:var(--tx2)}
.qz-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qz-btns .btn{min-height:46px;padding:0 12px;font-size:14px}
.qz-again{display:block;margin:14px auto 0;font-size:14px}

/* =========================================================
   LJÓST ÞEMA (útlitstillaga B · One UI)
   ========================================================= */
:root[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#e9ebf0; --s1:#ffffff; --s2:#f1f2f5; --s3:#e4e6eb; --line:rgba(11,12,16,.08); --line2:rgba(11,12,16,.15);
  --tx:#0b0c10; --tx2:#3a3d46; --mu:#53565f; --mu2:#666974;
  --tint:#1428A0; --glow:rgba(20,40,160,.28); --bad:#c62828;
  --cline:transparent; --shadow:0 1px 2px rgba(16,24,64,.05),0 6px 20px rgba(16,24,64,.06); --hdr:rgba(246,247,249,.68); --hdr-shadow:0 6px 24px rgba(16,24,64,.08);
  --navbg:rgba(255,255,255,.72); --nav-on:#e3e8ff; --nav-on-tx:#1428A0; --nav-shadow:0 8px 28px rgba(16,24,64,.12);
  --on:#0b0c10; --on-tx:#fff;
  --soft:#e6ebff; --soft-tx:#1428A0; --soft-ic:#1428A0;
  --special:linear-gradient(160deg,#dde4ff 0%,#ffffff 72%); --special-line:transparent;
  --cd-bg:#ffffff; --flash:rgba(20,40,160,.08);
  --logo-line:rgba(11,12,16,.42); --logo-tx:#45484f;
  --logo:#000; /* Samsung-merkið: svart á ljósu */
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"] .hero-orb{opacity:.35}
:root[data-theme="light"] .hero-orb::before,:root[data-theme="light"] .hero-orb::after{border-color:rgba(20,40,160,.12)}
:root[data-theme="light"] .fin-glow{opacity:.35}
:root[data-theme="light"] .cd div{box-shadow:var(--shadow)}
:root[data-theme="light"] .btn.primary{box-shadow:0 8px 20px -10px rgba(20,40,160,.6)}
:root[data-theme="light"] .pod .base{background:linear-gradient(180deg,#e4e6eb,#f4f5f7)}
:root[data-theme="light"] .pod:nth-child(2) .base{background:linear-gradient(180deg,#1428A0,#2a44d4)}
:root[data-theme="light"] .ph-art .pz,:root[data-theme="light"] .grand-art .pz{filter:drop-shadow(0 6px 12px rgba(20,40,160,.18))}
:root[data-theme="light"] .demo-note{border-color:rgba(20,40,160,.3)}
:root[data-theme="light"] .lb li.cut{background:repeating-linear-gradient(-45deg,rgba(20,40,160,.10) 0 8px,rgba(20,40,160,.05) 8px 16px)}
@media (min-width:600px){
  :root[data-theme="light"] body{background:var(--bg2)}
  :root[data-theme="light"] .app{box-shadow:0 0 80px rgba(16,24,64,.08);border-inline-color:transparent}
}

/* útlitsval á „Ég“ síðunni */
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;padding:4px;border-radius:99px;background:var(--s2)}
.theme-seg button{height:40px;border-radius:99px;font-size:14px;font-weight:600;color:var(--mu);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.theme-seg button .ic{width:16px;height:16px}
.theme-seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}

/* =========================================================
   STIGATAFLA — efstu 10 skýrir, neðri hluti dofnar út
   ========================================================= */
.lb.fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 240px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 240px),transparent 100%);border-bottom-left-radius:0;border-bottom-right-radius:0}
.lb li.gh{filter:blur(var(--b,4px));opacity:var(--o,.7);pointer-events:none;user-select:none}
.lb-more{position:relative;margin:-38px 16px 0;padding:0 20px;text-align:center;font-size:13px;color:var(--mu);z-index:1}
.lb-more b{display:block;color:var(--tx);font-family:var(--head);font-weight:600;font-size:14px;margin-bottom:2px}
.lb-mine{margin-top:18px}
.lb-mine .lbl{margin:0 20px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}

/* =========================================================
   BREIÐIR SKJÁIR (≥700px): samanbrjótanlegir símar (Fold), spjaldtölvur,
   símar á hlið og tölvur. Símaútlit helst óbreytt undir 700px.
   ========================================================= */
@media (min-width:700px){
  :root{--frame:100vw}
  body,:root[data-theme="light"] body{background:var(--bg)}
  .app,:root[data-theme="light"] .app{max-width:none;border:0;box-shadow:none}
  #view{max-width:1200px;margin:0 auto;padding:16px max(20px,3vw) 0}
  #view:not(.v-home):not(.v-eps){max-width:800px}
  .page-h{padding:36px 16px 12px}
  .page-h h2{font-size:44px}

  /* forsíða: tveggja dálka */
  .v-home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;grid-auto-flow:row dense;align-items:stretch}
  .v-home>*{margin:0!important;width:auto!important}
  .v-home .ref-banner,.v-home .mile-card,.v-home .eps-block,.v-home .how-card,.v-home .foot{grid-column:1/-1}
  .v-home .hero{padding:44px 8px 20px;align-self:center;overflow:visible}
  .v-home .hero h1{font-size:clamp(44px,6vw,60px)}
  .v-home .hero .lede{font-size:17px;max-width:44ch}
  .v-home .hero-orb{right:-40px;top:-60px;width:420px;height:420px}
  .v-home .card{padding:26px}
  .v-home .eps-block .sec-h{padding:8px 4px 4px}
  .v-home .rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;overflow:visible;padding:12px 0 0}
  .v-home .rail-card svg.art{height:300px}
  .v-home .rail-card:hover{transform:translateY(-3px)}
  .rail-card{transition:transform .2s}
  .v-home .how{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .v-home .how li{border-top:0;padding:12px 0 0}
  .v-home .foot{padding:12px 4px}
  .v-home .swcard{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;padding:0}
  .v-home .swcard .sw-art{padding:32px 24px 32px 40px}
  .v-home .swcard .sw-art svg{max-width:400px}
  .v-home .swcard .sw-txt{padding:32px 48px 32px 8px}
  .v-home .swcard h3{font-size:40px}
  .v-home .swcard p{font-size:16px}

  /* þættir: tveggja dálka */
  .v-eps{max-width:1100px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
  .v-eps>*{grid-column:1/-1;margin:0!important;width:auto!important}
  .v-eps>.ep{grid-column:auto}
  .v-eps .ep{grid-template-columns:140px 1fr;padding:16px}
  .v-eps .ep-art{width:140px;height:172px}

  .card,.seg,.lb,.prize-list,.ep,.demo-note,.ref-banner{margin-left:0;margin-right:0}
  .feat,.prizes-hero,.mile-card,.ep{width:100%}
  .sec-h,.lb-more{padding-left:4px;padding-right:4px}
  .lb-more{margin-left:0;margin-right:0}
  .lb-mine .lbl{margin-left:4px}
  .micro[style*="padding:0 20px"]{padding:0 4px!important}

  /* gluggar fyrir miðju */
  .sheet{top:50%;bottom:auto;width:min(560px,calc(100vw - 48px));max-height:min(880px,88vh);border-radius:28px;border:1px solid var(--line2);padding:22px 28px 28px;transform:translate(-50%,-47%);opacity:0;transition:transform .3s cubic-bezier(.2,.85,.2,1),opacity .25s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet:not(.on){transition:transform .3s,opacity .25s,visibility 0s .3s}
  .grab{display:none}
  .sh-x{top:16px;right:16px}

}

/* 700–1023px (t.d. Galaxy Z Fold opinn, spjaldtölvur): valmyndin helst neðst en mjórri, haus fylgir efnisbreidd */
@media (min-width:700px) and (max-width:1023px){
  .top{padding:0 max(20px,3vw)}
  .nav{width:min(520px,calc(100% - 24px))}
  .v-home .rail{gap:14px}
  .v-home .rail-card svg.art{height:clamp(190px,26vw,260px)}
  .v-home .card{padding:22px}
  .v-home .swcard .sw-art{padding:24px 12px 24px 24px}
  .v-home .swcard .sw-txt{padding:24px 28px 24px 4px}
  .v-home .swcard h3{font-size:32px}
}
/* áskoranir í símaramma þegar skjárinn er nógu hár; á lágum skjá (sími á hlið) fyllir áskorunin skjáinn */
@media (min-width:700px) and (min-height:600px){
  body.stage-open .sheet-bg{opacity:1;pointer-events:auto;z-index:59;background:rgba(0,0,0,.72)}
  .stage{top:50%;bottom:auto;transform:translate(-50%,-50%);width:430px;height:min(900px,calc(100vh - 40px));border-radius:44px;border:9px solid #1c1d23;box-shadow:0 40px 120px rgba(0,0,0,.6)}
}
/* sími á hlið (lágur og breiður skjár): áskorunin í hæfilegri breidd fyrir miðju */
@media (min-width:700px) and (max-height:599px){
  body.stage-open .sheet-bg{opacity:1;pointer-events:auto;z-index:59;background:rgba(0,0,0,.72)}
  .stage{width:min(560px,100%)}
}
/* TÖLVA (≥1024px): valmyndin færist upp í hausinn */
@media (min-width:1024px){
  .app,:root[data-theme="light"] .app{padding-bottom:48px}
  .top{height:72px;padding:0 max(32px,calc((100% - 1136px)/2))}
  .nav{top:14px;bottom:auto;left:50%;transform:translateX(-50%);width:auto;height:44px;display:flex;align-items:center;gap:2px;padding:0 4px;border:1px solid var(--line);border-radius:99px;background:var(--navbg);box-shadow:none;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);z-index:31}
  .nav button{flex-direction:row;gap:8px;height:36px;padding:0 14px;border-radius:99px;font-size:14px;color:var(--mu)}
  .nav button:hover{background:var(--s2);color:var(--tx)}
  .nav button .ic{width:19px;height:19px;padding:0;background:none!important}
  .nav button.on{background:var(--nav-on);color:var(--nav-on-tx)}
  .theme-btn{width:40px;height:40px}
  .toast{bottom:32px}
}
</style>

const daLens = (u, x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#07080d" stroke="url(#${u}ti)" stroke-width="${r*.22}"/><circle cx="${x}" cy="${y}" r="${r*.62}" fill="url(#${u}ln)"/><circle cx="${x-r*.22}" cy="${y-r*.25}" r="${r*.16}" fill="#fff" opacity=".7"/>`;

function daSBack(u, x, y, w, h) { // S Ultra bakhlið, kassalaga
  const cx = x + w*.27;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.11}" fill="url(#${u}ti)"/>
  <rect x="${x+1.1}" y="${y+1.1}" width="${w-2.2}" height="${h-2.2}" rx="${w*.09}" fill="url(#${u}bk)"/>
  ${daLens(u,cx,y+h*.14,w*.13)}${daLens(u,cx,y+h*.27,w*.13)}${daLens(u,cx,y+h*.40,w*.13)}${daLens(u,x+w*.55,y+h*.27,w*.1)}

function daSFront(u, x, y, w, h, screen) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.1}" fill="url(#${u}ti)"/>

function daFoldOpen(u, x, y, w, h, inner) {

function daFoldApps(x, y, w, h) { // tvö öpp hlið við hlið
  const half = w/2;
  return `<rect x="${x+3.5}" y="${y+6}" width="${half-6}" height="${h*.16}" rx="1.6" fill="#fff" opacity=".9"/>

}

function daCts(u, x, y, w, h) { // Circle to Search á skjá

function daFlipClosed(u, x, y, w, h) { // Flip lokaður: ytri skjár, myndavélar niðri til hægri
  const ic=[.95,.6,.8,.5,.55,.85,.5,.9];let apps='';
  for(let r=0;r<2;r++)for(let c=0;c<4;c++)apps+=`<rect x="${x+w*(.13+c*.165)}" y="${y+h*(.4+r*.135)}" width="${w*.12}" height="${w*.12}" rx="${w*.04}" fill="#fff" opacity="${ic[r*4+c]}"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.16}" fill="url(#${u}ti)"/>

function art(k,cls='art'){

  return `<svg xmlns="http://www.w3.org/2000/svg" class="${cls}" viewBox="0 0 100 125" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="125" fill="${bg}"/>${st}${g}</svg>`;
}

const fold=s=>String(s).toLowerCase().replace(/ð/g,'d').replace(/þ/g,'th').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const ORGS=ORG_RAW.split('\n').map((l,i)=>{const [t,n,p,x]=l.split('|');return{t,n,p:p||'',i,fn:fold(n),fx:fold(x||''),fp:fold(p||'')}});
function orgSearch(q){
  const f=fold(q);if(!f)return[];
  const r=[];for(const o of ORGS){let s=9;
    if(o.fx&&(' '+o.fx+' ').includes(' '+f+' '))s=0;
    else if(o.fn.startsWith(f))s=1;
    else if((' '+o.fn).includes(' '+f))s=2;
    else if(o.fx&&(' '+o.fx).includes(' '+f))s=3;
    else if(f.length>2&&o.fn.includes(f))s=4;
    else if(o.fp&&o.fp.startsWith(f))s=5;
    if(s<9)r.push([s,o])}
  return r.sort((a,b)=>a[0]-b[0]||a[1].i-b[1].i).slice(0,6).map(x=>x[1]);
}
let acN=0;
function orgPicker(inp){
  if(!inp||inp.dataset.ac)return;inp.dataset.ac=1;
  const box=document.createElement('div');box.className='ac';box.id='ac'+(++acN);box.setAttribute('role','listbox');box.hidden=true;inp.after(box);
  inp.setAttribute('role','combobox');inp.setAttribute('aria-autocomplete','list');inp.setAttribute('aria-controls',box.id);inp.setAttribute('aria-expanded','false');inp.setAttribute('autocomplete','off');
  let items=[],sel=-1;
  const show=v=>{box.hidden=!v;inp.setAttribute('aria-expanded',v?'true':'false')};
  const draw=()=>{const q=inp.value.trim();items=orgSearch(q);
    if(!q||items.some(o=>o.n===q)&&items.length===1)return show(false);
    box.innerHTML=items.length
      ?items.map((o,i)=>`<button type="button" role="option" aria-selected="${i===sel}" class="${i===sel?'on':''}" data-i="${i}"><span>${esc(o.n)}</span><small>${ORG_T[o.t]}${o.p?' · '+esc(o.p):''}</small></button>`).join('')
      :`<p>Ekki á listanum. „${esc(q)}“ verður skráð eins og þú skrifar það.</p>`;
    show(true)};
  const pick=o=>{inp.value=o.n;sel=-1;show(false);inp.closest('[data-f]')&&inp.closest('[data-f]').classList.remove('err');buzz(8)};
  inp.addEventListener('input',()=>{sel=-1;draw()});
  inp.addEventListener('focus',()=>{draw();if(matchMedia('(max-width:700px)').matches){const l=inp.closest('.f');setTimeout(()=>l&&l.scrollIntoView({block:'start',behavior:'smooth'}),280)}});
  inp.addEventListener('blur',()=>setTimeout(()=>show(false),150));
  inp.addEventListener('keydown',e=>{if(box.hidden||!items.length)return;
    if(e.key==='ArrowDown'){sel=(sel+1)%items.length;draw();e.preventDefault()}
    else if(e.key==='ArrowUp'){sel=(sel-1+items.length)%items.length;draw();e.preventDefault()}
    else if(e.key==='Enter'&&sel>=0){pick(items[sel]);e.preventDefault()}
    else if(e.key==='Escape'){show(false)}});
  box.addEventListener('mousedown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(b){e.preventDefault();pick(items[+b.dataset.i])}});
}

const DOCS={rules:rulesDoc,privacy:privacyDoc};
let docEl=null;
function openDoc(kind){
  if(!DOCS[kind])return;
  if(!docEl){docEl=document.createElement('div');docEl.className='doc';docEl.setAttribute('role','dialog');docEl.setAttribute('aria-modal','true');docEl.hidden=true;document.body.appendChild(docEl);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&docEl&&!docEl.hidden)closeDoc()});
    docEl.addEventListener('click',e=>{
      const t=e.target.closest('[data-doc]');if(t){openDoc(t.dataset.doc);return}
      if(e.target.closest('.doc-x')){closeDoc();return}
      if(e.target.closest('[data-top]')){docEl.scrollTo({top:0,behavior:'smooth'});return}
      const a=e.target.closest('[data-to]');if(a){e.preventDefault();const s=docEl.querySelector('#'+a.dataset.to);s&&s.scrollIntoView({behavior:'smooth',block:'start'})}});
  }
  docEl.setAttribute('aria-label',kind==='rules'?'Leikreglur':'Persónuverndarstefna');
  docEl.innerHTML=`<div class="doc-bar"><div class="doc-tabs" role="tablist">${[['rules','Leikreglur'],['privacy','Persónuvernd']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${k===kind}" class="${k===kind?'on':''}" data-doc="${k}">${l}</button>`).join('')}</div><button type="button" class="doc-x" aria-label="Loka">${ic('close')}</button></div><article class="doc-body">${DOCS[kind]()}</article>`;
  docEl.scrollTop=0;docEl.hidden=false;document.body.style.overflow='hidden';
  requestAnimationFrame(()=>docEl.classList.add('on'));
  setTimeout(()=>{const x=docEl.querySelector('.doc-x');x&&x.focus({preventScroll:true})},50);
}
function closeDoc(){if(!docEl)return;docEl.classList.remove('on');
  setTimeout(()=>{docEl.hidden=true;if(!sheetEl.classList.contains('on')&&$('#stage').hidden)document.body.style.overflow=''},260)}

function makePins(el,onFull){
  el.innerHTML='<input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Tölustafur">'.repeat(4);
  const ins=$$('input',el);
  ins.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&i<3)ins[i+1].focus();if(ins.every(x=>x.value)&&onFull)onFull()});
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0){ins[i-1].focus();ins[i-1].value=''}if(e.key==='Enter'&&onFull)onFull()});
    inp.addEventListener('paste',e=>{const t=((e.clipboardData||{}).getData?e.clipboardData.getData('text'):'').replace(/\D/g,'').slice(0,4);if(t){e.preventDefault();t.split('').forEach((c,j)=>ins[j]&&(ins[j].value=c));ins[Math.min(t.length,3)].focus();if(t.length===4&&onFull)onFull()}});
  });
  return{val:()=>ins.map(x=>x.value).join(''),clear:()=>{ins.forEach(x=>x.value='');ins[0].focus()},shake:()=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}};
}
