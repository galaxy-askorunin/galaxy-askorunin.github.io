 <defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f30"/><stop offset="1" stop-color="#141c52"/></linearGradient></defs>
 <rect width="400" height="300" fill="url(#wl)"/>
 <circle cx="220" cy="135" r="78" fill="none" stroke="#3b56ff" stroke-width="6" opacity=".9"/><circle cx="220" cy="135" r="78" fill="none" stroke="#7d90ff" stroke-width="16" opacity=".18"/>
 <rect x="300" y="40" width="70" height="90" rx="6" fill="#0d133c" stroke="rgba(255,255,255,.12)"/><rect x="310" y="52" width="50" height="6" rx="3" fill="rgba(255,255,255,.2)"/><rect x="310" y="64" width="34" height="6" rx="3" fill="rgba(255,255,255,.12)"/>
 <path d="M38 296h22l4-34H34z" fill="#2b2e38"/><path d="M49 262c-14-20-22-44-12-70 8 18 12 40 12 70zM49 262c4-26 14-46 30-60-2 24-12 44-30 60zM49 262c-10-12-26-20-36-18 6 14 20 20 36 18z" fill="#3b56ff" opacity=".85"/>
 <rect x="0" y="292" width="400" height="188" fill="#0b0c12"/><rect x="0" y="292" width="400" height="3" fill="#2a2d3a"/>
 <rect x="142" y="300" width="118" height="8" rx="2" fill="#e9ecf6"/><rect x="146" y="308" width="112" height="8" rx="2" fill="#3b56ff"/>
 <g transform="translate(330 312)"><ellipse cx="-16" cy="0" rx="15" ry="9" fill="#05060c" stroke="#9aa0b4" stroke-width="2"/><ellipse cx="16" cy="0" rx="15" ry="9" fill="#05060c" stroke="#9aa0b4" stroke-width="2"/><path d="M-2 -1q2-3 4 0" stroke="#9aa0b4" stroke-width="2" fill="none"/></g>
 <g transform="translate(96 372)"><rect x="-13" y="-46" width="26" height="92" rx="11" fill="#2a2d38"/><circle r="27" fill="#0a0a0f" stroke="#a6acc0" stroke-width="3.5"/><circle r="21" fill="#05060c"/><path d="M-12 4a12 12 0 0 1 24 0" stroke="#3b56ff" stroke-width="3" fill="none" stroke-linecap="round"/><text y="-4" text-anchor="middle" font-size="9" font-family="Arial" fill="#fff" font-weight="700">10:08</text><rect x="25" y="-6" width="5" height="12" rx="2" fill="#a6acc0"/></g>
 <g transform="translate(206 362)"><path d="M-22-30h44l-4 62a8 8 0 0 1-8 7h-20a8 8 0 0 1-8-7z" fill="#e9ecf6"/><path d="M21-16c16-2 18 22 0 22" stroke="#e9ecf6" stroke-width="6" fill="none"/><rect x="-22" y="-30" width="44" height="6" fill="#c9cddb"/><path d="M-8-44q-6 6 0 10M4-48q-6 6 0 12" stroke="rgba(255,255,255,.35)" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
 <g transform="translate(300 382)"><rect x="-32" y="-26" width="64" height="52" rx="24" fill="#f4f5fa"/><path d="M-31-6h62" stroke="#c9cddb" stroke-width="2"/><circle cx="0" cy="8" r="2.4" fill="#3b56ff"/></g>
</svg>`;
function gameCTS(root){
  const rounds=[
    {q:'Kynnirinn var með tæki á úlnliðnum sem fylgist með svefni og hjartslætti. Hringdu utan um það.',t:'watch',info:'Fylgist með svefni, hjartslætti og hreyfingu — og vinnur beint með símanum.'},
    {q:'Hvaða tæki notaði kynnirinn til að fá samtal þýtt beint í eyrað? Hringdu utan um það.',t:'buds',info:'Með símanum og Galaxy AI er hægt að hlusta á þýðingu í rauntíma.'}];
  let ri=0,armed=false,pts=[],drawing=false;
  root.innerHTML=`<div class="cts-q" id="cq"></div>
  <div class="cts-phone" id="ph"><div class="cts-scr" id="scr">${CTS_SVG}<canvas id="cc"></canvas><div class="cts-tint"></div><div class="cts-hint">Hringdu utan um tækið</div><span class="sim-tag" style="left:12px;bottom:10px">Hermun</span></div>
    <div class="navbar pulse" id="nbar" role="button" aria-label="Haltu inni til að virkja Circle to Search"><i></i></div>
    <div class="cts-res" id="res"></div></div>
  <div class="cts-msg" id="cm">Haltu inni <b>stikunni neðst</b> á skjánum til að virkja Circle to Search.</div>`;
  const ph=$('#ph',root),scr=$('#scr',root),cv=$('#cc',root),ctx=cv.getContext('2d'),nbar=$('#nbar',root),cm=$('#cm',root),res=$('#res',root);
  let dpr=1,rw=0,rh=0;const tms=[];
  const size=()=>{const r=scr.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);rw=r.width;rh=r.height;cv.width=rw*dpr;cv.height=rh*dpr};
  const sx=()=>rw/400;
  const msg=(h,bad)=>{cm.innerHTML=h;cm.classList.toggle('bad',!!bad)};
  const setQ=()=>{$('#cq',root).innerHTML=`<span class="k">Spurning ${ri+1}/2</span><p>${rounds[ri].q}</p>`};
  setQ();
  const clear=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height)};
  const stroke=(final)=>{clear();if(pts.length<2)return;ctx.setTransform(dpr*sx(),0,0,dpr*sx(),0,0);
    if(final){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,400,480);ctx.globalCompositeOperation='destination-out';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.globalCompositeOperation='source-over'}
    ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(final)ctx.closePath();
    ctx.strokeStyle='rgba(120,150,255,.45)';ctx.lineWidth=12;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke()};
  // virkja með því að halda inni stikunni
  let lp=null;
  const lpStart=e=>{if(armed)return;e.preventDefault();nbar.classList.add('press');lp=setTimeout(()=>{armed=true;nbar.classList.remove('press','pulse');ph.classList.add('active');buzz(18);size();msg('Teiknaðu hring með puttanum utan um rétta tækið.')},420)};
  const lpEnd=()=>{clearTimeout(lp);nbar.classList.remove('press')};
  nbar.addEventListener('pointerdown',lpStart);nbar.addEventListener('pointerup',lpEnd);nbar.addEventListener('pointerleave',lpEnd);nbar.addEventListener('pointercancel',lpEnd);
  const toP=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*400,y:(e.clientY-r.top)/r.height*480}};
  cv.addEventListener('pointerdown',e=>{if(!armed)return;cv.setPointerCapture(e.pointerId);drawing=true;pts=[toP(e)];stroke()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=toP(e),l=pts[pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>2.5){pts.push(p);stroke()}});
  const end=()=>{if(!drawing)return;drawing=false;evaluate()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  function pip(x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))c=!c}return c}
  function evaluate(){
    if(pts.length<10){clear();return}
    const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys);
    const s=pts[0],e=pts[pts.length-1];
    if(Math.hypot(s.x-e.x,s.y-e.y)>Math.max(45,.5*Math.max(bw,bh))){msg('Lokaðu hringnum — byrjaðu og endaðu á sama stað.',true);tms.push(setTimeout(clear,500));return}
    const inside=CTS_OBJ.filter(o=>pip(o.cx,o.cy));const R=rounds[ri];const tg=CTS_OBJ.find(o=>o.id===R.t);
    if(inside.length===1&&inside[0].id===R.t){
      const ta=(tg.bb[2]-tg.bb[0])*(tg.bb[3]-tg.bb[1]);
      if(bw*bh>ta*7){msg('Of stór hringur — hringdu þéttar utan um tækið.',true);tms.push(setTimeout(clear,500));return}
      stroke(true);armed=false;ph.classList.remove('active');buzz(20);
      res.innerHTML=`<div class="k">${ic('spark')} Galaxy AI · leitarniðurstaða</div><b>${tg.name}</b><p>${R.info}</p><button class="btn white sm" id="rn">${ri<rounds.length-1?'Næsta spurning':'Ljúka áskorun'}</button>`;
      res.classList.add('on');msg('Rétt!');
      $('#rn',res).onclick=()=>{res.classList.remove('on');ri++;if(ri>=rounds.length){win();return}pts=[];clear();setQ();nbar.classList.add('pulse');msg('Haltu aftur inni <b>stikunni neðst</b> til að virkja Circle to Search.')};
    }else if(inside.length===0){msg('Hringurinn þarf að ná utan um tækið sjálft.',true);tms.push(setTimeout(clear,500))}
    else if(inside.some(o=>o.id===R.t)){msg('Hringdu bara utan um eitt tæki.',true);tms.push(setTimeout(clear,500))}
    else{mistake();msg(`Þetta er ${inside[0].name.toLowerCase()} — ekki rétta tækið.`,true);ph.classList.remove('shake');void ph.offsetWidth;ph.classList.add('shake');tms.push(setTimeout(clear,600))}
  }
  const onR=()=>{if(armed)size()};window.addEventListener('resize',onR);
  G.cleanup.push(()=>{clearTimeout(lp);tms.forEach(clearTimeout);window.removeEventListener('resize',onR)});
}
const GAMES={zoom:gameZoom,fold:gameFold,flip:gameFlip,cts:gameCTS};

/* =========================================================
   Atburðir & lifandi uppfærslur
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-ep],[data-act],[data-mode]');if(!t)return;
  if(t.closest('#stage'))return;
  if(t.tagName==='A')e.preventDefault();
  if(t.dataset.modeSet)boardMode=t.dataset.modeSet;
  if(t.dataset.go){closeSheet();go(t.dataset.go)}
  else if(t.dataset.ep){openEp(+t.dataset.ep)}
  else if(t.dataset.mode){boardMode=t.dataset.mode;render()}
  else if(t.dataset.act){const a=t.dataset.act;
    if(a==='register')openRegister();
    else if(a==='boost')openBoost();
    else if(a==='switch')openSwitch();
    else if(a==='ics')openCal();
    else if(a==='invite')openInvite(false);
    else if(a==='inviteWork')openInvite(true);
    else if(a==='editWork')openEditWork();
    else if(a==='shareStatus')openShare(statusCard());
    else if(a==='shareMile'){S.mileShared=S.miles[S.miles.length-1];save();const c=statusCard();c.kicker='Nýr áfangi';c.title='Þú náðir '+fmt(S.mileShared)+' stjörnum!';openShare(c);render()}
    else openInfo(a)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!stage.hidden)closeStage();else closeSheet()}});

setInterval(()=>{const c=$('#cd');if(c)c.innerHTML=cdHTML()},30000);
const topEl=$('.top');const onScroll=()=>topEl.classList.toggle('scrolled',window.scrollY>8);window.addEventListener('scroll',onScroll,{passive:true});onScroll();
const lr=mulberry32(99);
setInterval(()=>{
  const p=PLAYERS[3+Math.floor(lr()*(PLAYERS.length-3))];const add=50*(1+Math.floor(lr()*8));p.pts+=add;p.wk+=Math.round(add/3);
  const w=WORKSTATS[Math.floor(lr()*WORKSTATS.length)];w.avg+=Math.round(lr()*40);if(lr()<.3)w.n++;
  if(VIEW==='board'&&!sheetEl.classList.contains('on')&&stage.hidden){render();const li=$(`#lb [data-id="${p.id}"]`);if(li){li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),900)}}
  else if(VIEW==='home'){const h=$('#homeRank'),rk=myRank();if(h)h.textContent=rk?rk+'.':'–'}
},4200);

render();
})();
</script>
